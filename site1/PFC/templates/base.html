<!DOCTYPE html>
<html lang="pt_br" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <title>PFC</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        {% block head %}
        {% endblock %}
    </head>
    <body class="bg-black text-white m-0 p-0">

        {% include "navbar.html" %}

        <!-- Copia o recuo exato da navbar (px-4 ou px-5) -->
        <main class="container-fluid px-4 px-lg-5 mt-4">
            {% with mensagens = get_flashed_messages(with_categories=True) %}
                {% if mensagens %}
                    {% for categoria, mensagem in mensagens %}
                        <div class="alert {{ categoria }} alert-dismissible fade show" role="alert">
                            {{ mensagem }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block body %}
            {% endblock %}
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
